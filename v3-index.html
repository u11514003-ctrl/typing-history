<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英打挑戰｜Typing Game</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#dcecff 0%,#f8e4f4 48%,#fff3d6 100%);
  color:#38456b; display:flex; justify-content:center; padding:24px;
}
.game{width:min(1050px,100%);}
.header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:16px}
.title h1{margin:0;font-size:42px;color:#5369c9;text-shadow:2px 3px 0 white}
.title p{margin:5px 0;color:#68739a}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.82);border:2px solid white;border-radius:18px;padding:10px 18px;text-align:center;box-shadow:0 6px 18px #8091b333}
.stat span{display:block;font-size:12px;color:#7882a5}.stat strong{font-size:24px}
.stage{
 position:relative;height:520px;overflow:hidden;border:5px solid white;border-radius:28px;
 background:linear-gradient(#9bc9ff,#c9ddff 60%,#e8dff8);
 box-shadow:0 12px 30px #6879a833;
}
.cloud{position:absolute;background:#fff8;border-radius:50%;filter:blur(1px)}
.c1{width:180px;height:70px;top:35px;left:-30px}.c2{width:220px;height:80px;top:100px;right:-40px}.c3{width:150px;height:60px;bottom:50px;left:10px}
.letter{
 position:absolute;width:64px;height:64px;border-radius:19px;display:flex;align-items:center;justify-content:center;
 font-size:32px;font-weight:bold;color:white;border:4px solid #ffffffaa;
 box-shadow:0 7px 15px #52639b55, inset 0 0 12px #ffffff66;
 text-shadow:1px 2px 2px #52608066; z-index:5;
}
.hitline{position:absolute;bottom:45px;left:18px;right:18px;border-top:4px dashed #fff;z-index:3}
.ground{position:absolute;bottom:0;left:0;right:0;height:45px;background:#ffffff55}
.controls{display:flex;justify-content:center;gap:12px;margin:18px 0;flex-wrap:wrap}
button{border:0;border-radius:16px;padding:13px 28px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 6px 14px #6574a333}
.start{background:#ff8fa7;color:white}.pause{background:#9eb7ff;color:white}.reset{background:white;color:#59658c}
.keyboard{background:#ffffffaa;border:3px solid white;border-radius:22px;padding:16px;text-align:center}
.keyrow{display:flex;justify-content:center;gap:7px;margin:6px 0;flex-wrap:wrap}
.key{width:42px;height:42px;border-radius:10px;background:#eef2ff;border:2px solid #c8d3ff;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#596aa8}
.info{text-align:center;margin-top:12px;color:#6d789b;font-size:14px}
.flash{animation:pop .22s ease-out}
@keyframes pop{50%{transform:scale(1.25);opacity:.4}}
@media(max-width:650px){
 body{padding:10px}.title h1{font-size:31px}.stage{height:430px}.letter{width:52px;height:52px;font-size:25px}
 .stat{padding:7px 11px}.stat strong{font-size:19px}
}
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <div class="title">
      <h1>👑 英打挑戰</h1>
      <p>打出正確的字母，讓它消失！速度會越來越快！</p>
    </div>
    <div class="stats">
      <div class="stat"><span>⭐ 分數</span><strong id="score">0</strong></div>
      <div class="stat"><span>❤️ 失誤</span><strong id="miss">0</strong></div>
      <div class="stat"><span>⚡ 速度</span><strong id="speed">1.0x</strong></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="hitline"></div><div class="ground"></div>
  </div>

  <div class="controls">
    <button class="start" id="start">▶ 開始遊戲</button>
    <button class="pause" id="pause">Ⅱ 暫停</button>
    <button class="reset" id="reset">↻ 重新開始</button>
  </div>

  <div class="keyboard">
    <div class="keyrow" id="keyboard"></div>
    <div class="info">⌨️ 直接使用鍵盤輸入字母　｜　按對字母會立即消失並加分</div>
  </div>
</div>

<script>
const stage=document.getElementById("stage");
const scoreEl=document.getElementById("score");
const missEl=document.getElementById("miss");
const speedEl=document.getElementById("speed");
const startBtn=document.getElementById("start");
const pauseBtn=document.getElementById("pause");
const resetBtn=document.getElementById("reset");
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const colors=["#ff8fab","#74c69d","#ffb84d","#9b7ede","#62c6d9","#6f8ee8"];
let score=0,miss=0,running=false,paused=false,last=0,spawnTimer=0,items=[],speed=1;

letters.forEach(l=>{
 const k=document.createElement("div");k.className="key";k.textContent=l;
 document.getElementById("keyboard").appendChild(k);
});

function updateUI(){
 scoreEl.textContent=score; missEl.textContent=miss;
 speed=(1+Math.floor(score/5)*0.25);
 speedEl.textContent=speed.toFixed(2)+"x";
}
function makeLetter(){
 if(!running||paused)return;
 const el=document.createElement("div");el.className="letter";
 const value=letters[Math.floor(Math.random()*letters.length)];
 el.textContent=value; el.dataset.key=value;
 el.style.background=colors[Math.floor(Math.random()*colors.length)];
 const x=20+Math.random()*85;
 el.style.left=x+"%"; el.style.top="-70px";
 stage.appendChild(el);
 items.push({el,y:-70,key:value});
}
function removeItem(item,success){
 if(!item.el.parentNode)return;
 item.el.classList.add("flash");
 if(success){
   score++; updateUI();
   setTimeout(()=>item.el.remove(),120);
 }else{
   miss++; updateUI(); item.el.remove();
 }
 items=items.filter(x=>x!==item);
}
function loop(t){
 if(!running){last=t;requestAnimationFrame(loop);return}
 if(!paused){
   if(!last)last=t;
   const dt=Math.min(40,t-last); last=t;
   spawnTimer+=dt;
   const interval=Math.max(420,900-score*10);
   if(spawnTimer>=interval){spawnTimer=0;makeLetter()}
   const stageH=stage.clientHeight-115;
   items.slice().forEach(item=>{
     item.y += (0.075*speed*dt);
     item.el.style.top=item.y+"px";
     if(item.y>=stageH) removeItem(item,false);
   });
 }else last=t;
 requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 const key=e.key.toUpperCase();
 if(!/^[A-Z]$/.test(key)||e.repeat)return;
 const item=items.find(x=>x.key===key);
 if(item)removeItem(item,true);
});
startBtn.addEventListener("click",()=>{
 if(!running){running=true;paused=false;startBtn.textContent="▶ 遊戲進行中";makeLetter()}
});
pauseBtn.addEventListener("click",()=>{
 if(!running)return;
 paused=!paused; pauseBtn.textContent=paused?"▶ 繼續":"Ⅱ 暫停";
});
resetBtn.addEventListener("click",()=>{
 items.forEach(x=>x.el.remove());items=[];score=0;miss=0;speed=1;running=false;paused=false;spawnTimer=0;
 startBtn.textContent="▶ 開始遊戲";pauseBtn.textContent="Ⅱ 暫停";updateUI();
});
updateUI(); requestAnimationFrame(loop);
</script>
</body>
</html>
